<a id="skip-link" class="skip-link" href="#main-content">{{ 'app.skipLink' | t }}</a>

<lm-nav-bar id="app-navigation" />

<main id="main-content" class="main app-main" tabindex="-1">
  <router-outlet />
</main>

<lm-location-picker id="location-selector" />
<lm-day-picker id="day-selector" />
<lm-settings-panel id="settings-panel" />
@if (installGuide(); as guide) {
  <ng-container *ngComponentOutlet="guide" />
}
@if (installInvite(); as invite) {
  <ng-container *ngComponentOutlet="invite" />
}
