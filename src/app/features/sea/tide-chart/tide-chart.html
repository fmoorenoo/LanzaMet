<div class="chart tide-chart-canvas">
  <svg class="art" [attr.viewBox]="viewBox" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="qth-tide-water" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" class="water-top" />
        <stop offset="1" class="water-bottom" />
      </linearGradient>
    </defs>
    @if (night(); as n) {
      <rect class="night" x="0" y="0" [attr.width]="n.morning" height="300" />
      <rect class="night" [attr.x]="n.evening" y="0" [attr.width]="1000 - n.evening" height="300" />
    }
    <g class="reveal">
      <path class="water" [attr.d]="area()" fill="url(#qth-tide-water)" />
      <path class="surface" [attr.d]="line()" />
    </g>
    <rect class="past" x="0" y="0" [attr.width]="nowX()" height="300" />
    <line class="now-line" [attr.x1]="nowX()" [attr.x2]="nowX()" y1="0" y2="300" />
  </svg>

  @for (label of labels(); track label.time) {
    <span
      class="extreme tide-chart-label"
      [attr.data-tide]="label.kind === 'pleamar' ? 'high' : 'low'"
      [class.is-high]="label.kind === 'pleamar'"
      [style.left.%]="label.left"
      [style.top.%]="label.top"
    >
      <span class="extreme-kind">{{ label.name | t }}</span>
      <span class="t-num"
        >{{ 'common.value' | t: { value: { time: label.time } } }} · {{ label.height | t }}</span
      >
    </span>
  }

  <span
    class="now tide-now-marker"
    [style.left.%]="nowLeft()"
    [style.top.%]="nowTop()"
    aria-hidden="true"
  >
    <span class="now-dot"></span>
  </span>
</div>

<div class="ticks tide-chart-axis t-num" aria-hidden="true">
  @for (tick of ticks; track tick.label) {
    <span [style.left.%]="tick.left">{{ tick.label }}</span>
  }
</div>
