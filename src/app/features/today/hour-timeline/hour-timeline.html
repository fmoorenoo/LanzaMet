<div class="section-head section-header timeline-head">
  <ng-content select="[timelineTitle]" />
  <div class="head-actions">
    <!-- Always laid out, shown only while an hour is previewed: nothing around it moves. -->
    <button
      id="back-to-now"
      type="button"
      class="btn btn--quiet back-to-now"
      [class.is-shown]="isPreview()"
      [inert]="!isPreview()"
      (click)="backToNow()"
    >
      {{ 'common.backToNow' | t }}
    </button>
    <qth-scroll-controls
      [scroller]="scroll"
      [backLabel]="'hours.previous' | t"
      [forwardLabel]="'hours.next' | t"
    />
  </div>
</div>

<div class="scroller hour-scroller" qthHorizontalScroll #scroll="horizontalScroll">
  <div
    class="track hour-track"
    role="group"
    [attr.aria-label]="'hours.label' | t"
    [style.--hours]="cells().length"
    (keydown)="onKeydown($event)"
  >
    <svg
      class="curve temperature-curve"
      [attr.viewBox]="'0 0 ' + cells().length + ' 60'"
      preserveAspectRatio="none"
      aria-hidden="true"
    >
      <path class="curve-line" [attr.d]="curve()" />
    </svg>

    @for (cell of cells(); track cell.index) {
      <button
        #cell
        type="button"
        class="cell hour-cell"
        [attr.data-index]="cell.index"
        [attr.data-time]="cell.time"
        [class.is-active]="cell.index === activeIndex()"
        [attr.aria-pressed]="cell.index === activeIndex()"
        [attr.tabindex]="cell.index === activeIndex() ? 0 : -1"
        [style.--y]="cell.y"
        (click)="choose(cell.index)"
      >
        <span class="day-mark">{{ cell.dayMark | t }}</span>
        <span class="time">{{ cell.label | t }}</span>
        <qth-sky-glyph [sky]="cell.sky" [isDaylight]="cell.isDaylight" [decorative]="true" />
        <span class="temp t-num">{{ cell.temperature }}°</span>
        <span class="curve-dot" aria-hidden="true"></span>
        <!-- The accessible name is the visible time and temperature, plus the rest in words. -->
        <span class="visually-hidden">, {{ cell.detail | t }}</span>
        <span class="wind" [attr.data-level]="cell.windLevel">
          <span class="wind-bar" [style.transform]="'scaleX(' + cell.windScale + ')'"></span>
        </span>
      </button>
    }
  </div>
</div>
<p class="legend hour-legend" aria-hidden="true">
  <span>{{ 'hours.hint' | t }}</span>
  <span class="legend-wind"><span class="legend-bar"></span>{{ 'hours.wind' | t }}</span>
</p>
