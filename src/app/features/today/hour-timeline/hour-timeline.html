<div class="section-head section-header timeline-head">
  <ng-content select="[timelineTitle]" />
  <div class="head-actions">
    <!-- Always laid out, shown only while an hour is previewed: nothing around it moves. -->
    <button
      id="back-to-now"
      type="button"
      class="btn btn--quiet back-to-now"
      [class.is-shown]="isPreview()"
      [inert]="!isPreview()"
      (click)="backToNow()"
    >
      {{ 'common.backToNow' | t }}
    </button>
    <lm-scroll-controls
      [scroller]="scroll"
      [backLabel]="'hours.previous' | t"
      [forwardLabel]="'hours.next' | t"
    />
  </div>
</div>

<div class="scroller hour-scroller" lmHorizontalScroll #scroll="horizontalScroll">
  <div
    class="track hour-track"
    role="group"
    [attr.aria-label]="'hours.label' | t"
    (keydown)="onKeydown($event)"
  >
    @for (cell of cells(); track cell.index) {
      <button
        #cell
        type="button"
        class="cell hour-cell"
        [attr.data-index]="cell.index"
        [attr.data-time]="cell.time"
        [attr.data-wind-level]="cell.windLevel"
        [class.is-active]="cell.index === activeIndex()"
        [class.is-new-day]="cell.dayMark"
        [attr.aria-pressed]="cell.index === activeIndex()"
        [attr.tabindex]="cell.index === activeIndex() ? 0 : -1"
        (click)="choose(cell.index)"
      >
        <span class="time">
          @if (cell.dayMark; as day) {
            <span class="day-mark">{{ day | t }}</span>
          }
          {{ cell.label | t }}
        </span>
        <span class="sky">
          <lm-sky-glyph [sky]="cell.sky" [isDaylight]="cell.isDaylight" [decorative]="true" />
          <span class="temp t-num">{{ cell.temperature }}°</span>
        </span>
        <!-- The accessible name is the visible text, with the rest in words. -->
        <span class="visually-hidden">, {{ cell.detail | t }}:</span>
        <span class="wind">
          <span class="wind-value t-num">
            <svg
              class="wind-arrow"
              viewBox="0 0 24 24"
              aria-hidden="true"
              [style.rotate]="cell.windTo"
            >
              <path d="M12 20.5V4M6.5 9.5 12 4l5.5 5.5" />
            </svg>
            {{ cell.windSpeed }}<span class="visually-hidden"> km/h</span>
          </span>
          <span class="wind-bar" aria-hidden="true">
            <span class="wind-fill" [style.transform]="'scaleY(' + cell.windShare + ')'"></span>
          </span>
        </span>
      </button>
    }
  </div>
</div>
<p class="legend hour-legend" aria-hidden="true">
  <span>{{ 'hours.hint' | t }}</span>
  <span class="legend-wind">
    <span class="legend-bars"><span></span><span></span><span></span></span>
    {{ 'hours.wind' | t }}
  </span>
</p>
