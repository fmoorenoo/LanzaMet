<ul class="days day-list">
  @for (row of rows(); track row.date; let i = $index) {
    <li class="day day-row enter-rise" [attr.data-date]="row.date" [style.--i]="i">
      <span class="summary">
        <span class="name">{{ row.name | t }}</span>
        <span class="phrase">
          {{ row.phrase | t }}
          @if (row.change) {
            · <span class="change">{{ row.change | t }}</span>
          }
        </span>
      </span>
      <lm-sky-glyph class="glyph" [sky]="row.sky" />
      <span class="temps t-num">
        <span class="min"
          ><span class="visually-hidden">{{ 'week.min' | t }} </span>{{ row.min }}°</span
        >
        <!-- The week's scale runs the whole track; each day shows its slice of it. -->
        <span class="range" aria-hidden="true">
          <span
            class="range-fill"
            [style.left.%]="row.start"
            [style.width.%]="row.size"
            [style.--start]="row.start"
            [style.--size]="row.size"
          ></span>
        </span>
        <span class="max"
          ><span class="visually-hidden">{{ 'week.max' | t }} </span>{{ row.max }}°</span
        >
      </span>
    </li>
  }
</ul>
