@let s = state();
@let art = scenery();

<!-- Shared paints for this scene, named per instance so pages with many scenes keep unique ids. -->
<svg class="paints" width="0" height="0" focusable="false">
  <defs>
    <linearGradient [attr.id]="ids.cloud" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" [style.stop-color]="s.cloud" />
      <stop [attr.offset]="cloudShadeFrom" [style.stop-color]="s.cloud" />
      <stop offset="1" [style.stop-color]="s.cloudShade" />
    </linearGradient>
    <linearGradient [attr.id]="ids.far" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0.15" [style.stop-color]="s.land.far" />
      <stop offset="1" [style.stop-color]="s.land.farMist" />
    </linearGradient>
    <!-- Swell bands fade into the water below them instead of ending in an edge. -->
    <linearGradient [attr.id]="ids.swellFar" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0.1" [style.stop-color]="s.sea.swellFar" />
      <stop offset="0.75" [style.stop-color]="s.sea.swellFar" style="stop-opacity: 0" />
    </linearGradient>
    <linearGradient [attr.id]="ids.swellMid" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0.1" [style.stop-color]="s.sea.swellMid" />
      <stop offset="0.8" [style.stop-color]="s.sea.swellMid" style="stop-opacity: 0" />
    </linearGradient>
    <!-- The near wave: light through its crest, deepening below. -->
    <linearGradient [attr.id]="ids.shallow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0.18" [style.stop-color]="s.sea.shallowTop" />
      <stop offset="0.5" [style.stop-color]="s.sea.shallow" />
      <stop offset="1" [style.stop-color]="s.sea.near" />
    </linearGradient>
    <linearGradient [attr.id]="ids.near" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" [style.stop-color]="s.land.nearTop" />
      <stop offset="0.7" [style.stop-color]="s.land.near" />
    </linearGradient>
  </defs>
</svg>

<div
  class="sky"
  [style.--sky-top]="s.sky.top"
  [style.--sky-mid]="s.sky.mid"
  [style.--sky-low]="s.sky.low"
></div>

<!-- The band of light along the horizon. -->
<div class="glow" [style.color]="s.glow.color" [style.opacity]="s.glow.strength"></div>

<svg class="stars" viewBox="0 0 100 100" preserveAspectRatio="none" [style.opacity]="s.stars">
  @for (star of stars; track $index) {
    <circle [attr.cx]="star[0]" [attr.cy]="star[1]" [attr.r]="star[2]" />
  }
</svg>

<div class="track sun-track" [style.transform]="sunTransform()" [style.opacity]="s.sun.visible">
  <div class="bloom" [style.color]="s.sun.color"></div>
  <div class="sun" [style.color]="s.sun.color" [class.is-low]="s.sun.lowSun"></div>
</div>

<div class="track moon-track" [style.transform]="moonTransform()" [style.opacity]="s.moon.visible">
  <div class="moon"></div>
</div>

<div class="clouds">
  @for (cloud of clouds; track $index) {
    <div
      #cloudTrack
      class="cloud-track"
      [style.top.%]="cloud.top"
      [style.transform]="'translate3d(' + cloud.rest + '%, 0, 0)'"
      [style.opacity]="cloudOpacity($index)"
    >
      <svg class="cloud" viewBox="0 0 200 80" [style.width.%]="cloud.width">
        <path [attr.d]="cloudPaths[cloud.shape]" [attr.fill]="ids.cloudUrl" />
      </svg>
    </div>
  }
</div>

<!-- The far range alone, so the mist can lie between it and what is near. -->
<svg class="land land--far" viewBox="0 0 1200 150" preserveAspectRatio="xMaxYMax slice">
  <path [attr.d]="horizon().far" [attr.fill]="ids.farUrl" />
  <!-- A nearer line of hills inside the range: two depths of distance. -->
  <path [attr.d]="horizon().farRidge" [style.fill]="s.land.farRidge" class="far-ridge" />
</svg>

<div class="mist" [style.color]="s.sky.low"></div>

<svg class="land" viewBox="0 0 1200 150" preserveAspectRatio="xMaxYMax slice">
  <g [attr.id]="ids.land">
    @let near = horizon().nearRelief;
    <path class="land-near" [attr.d]="horizon().near" [attr.fill]="ids.nearUrl" />
    <!-- Modelling: a lit crest, a shaded foot, gullies down the slopes. -->
    <path class="relief-light" [attr.d]="near.light" [style.fill]="s.land.nearLight" />
    <path class="relief-shade" [attr.d]="near.shade" [style.fill]="s.land.nearShade" />
    <path class="ribs" [attr.d]="near.ribs" [style.stroke]="s.land.nearLight" />
    <path class="gullies" [attr.d]="near.gullies" [style.stroke]="s.land.gully" />
    <g class="scenery">
      @if (art.terrain) {
        <path [attr.d]="art.terrain" [attr.fill]="ids.nearUrl" />
        <path class="relief-light" [attr.d]="art.relief.light" [style.fill]="s.land.nearLight" />
        <path class="relief-shade" [attr.d]="art.relief.shade" [style.fill]="s.land.nearShade" />
      }
      @if (art.beach) {
        <path [attr.d]="art.beach" [style.fill]="s.shore" />
      }
      @for (band of art.strata; track $index) {
        <path [attr.d]="band" [style.fill]="s.built.rock[$index % 3]" />
      }
      @if (art.relief.gullies) {
        <path class="ribs" [attr.d]="art.relief.ribs" [style.stroke]="s.land.nearLight" />
        <path class="gullies" [attr.d]="art.relief.gullies" [style.stroke]="s.land.gully" />
      }
      @if (art.lagoon) {
        <path [attr.d]="art.lagoon" [style.fill]="s.built.lagoon" />
      }
      @if (art.accent) {
        <path [attr.d]="art.accent" [style.fill]="s.built.accent" />
        <path [attr.d]="art.accentShade" [style.fill]="s.built.accentShade" />
      }
      @if (art.walls) {
        <!-- Glass first: a tower's floor lines and edges are walls drawn over it. -->
        <path [attr.d]="art.glass" [style.fill]="s.built.glass" />
        <path [attr.d]="art.walls" [style.fill]="s.built.wall" />
        <path [attr.d]="art.shade" [style.fill]="s.built.shade" />
        <path [attr.d]="art.windows" [style.fill]="s.built.window" />
        <path [attr.d]="art.trim" [style.fill]="s.built.trim" />
      }
      @if (art.trunks) {
        <path class="trunks" [attr.d]="art.trunks" [style.stroke]="s.built.palm" />
        <path class="fronds" [attr.d]="art.fronds" [style.fill]="s.built.palm" />
      }
      @for (lamp of art.lamps; track $index) {
        <circle
          class="lamp-halo"
          [attr.cx]="lamp.x"
          [attr.cy]="lamp.y"
          r="7"
          [style.fill]="s.built.lamp"
          [style.opacity]="s.built.lights * 0.3"
        />
        <circle
          [attr.cx]="lamp.x"
          [attr.cy]="lamp.y"
          r="1.7"
          [style.fill]="s.built.lamp"
          [style.opacity]="s.built.lights"
        />
      }
    </g>
  </g>
</svg>

<div class="haze" [style.opacity]="s.haze"></div>

<div
  class="sea"
  [style.--sea-horizon]="s.sea.horizon"
  [style.--sea-far]="s.sea.far"
  [style.--sea-near]="s.sea.near"
>
  <!-- Where sea meets sky: a hairline of light. -->
  <div
    class="seam"
    [style.color]="s.glow.color"
    [style.opacity]="0.35 + s.glow.strength * 0.5"
  ></div>

  <div
    class="track glint-track"
    [style.transform]="glint().transform"
    [style.opacity]="glint().opacity"
  >
    <div class="glint" [style.color]="glint().color"></div>
  </div>

  <div class="swell swell--far">
    <div #waveTrack class="swell-track">
      <svg viewBox="0 0 2400 100" preserveAspectRatio="none">
        <path
          [attr.d]="waves()[0].body"
          [style.d]="cssPath(waves()[0].body)"
          [attr.fill]="ids.swellFarUrl"
        />
        <path
          class="sheen"
          [attr.d]="waves()[0].crest"
          [style.d]="cssPath(waves()[0].crest)"
          [style.stroke]="s.sea.sheen"
          [style.opacity]="s.sea.sheenOpacity"
        />
      </svg>
    </div>
  </div>

  <div class="swell swell--mid">
    <div #waveTrack class="swell-track">
      <svg viewBox="0 0 2400 100" preserveAspectRatio="none">
        <path
          [attr.d]="waves()[1].body"
          [style.d]="cssPath(waves()[1].body)"
          [attr.fill]="ids.swellMidUrl"
        />
        <path
          class="sheen"
          [attr.d]="waves()[1].crest"
          [style.d]="cssPath(waves()[1].crest)"
          [style.stroke]="s.sea.sheen"
          [style.opacity]="s.sea.sheenOpacity * 0.8"
        />
      </svg>
    </div>
  </div>

  <!-- Small ripples on open water, lit like the crests. -->
  <svg class="ripples" viewBox="0 0 1000 100" preserveAspectRatio="none">
    <path
      [attr.d]="ripples"
      [style.stroke]="s.sea.sheen"
      [style.opacity]="0.15 + s.sea.sheenOpacity"
    />
  </svg>

  <svg class="shore" viewBox="0 0 100 100" preserveAspectRatio="none">
    <path [attr.d]="shore()" [style.fill]="s.shore" />
  </svg>

  <div class="swell swell--front" [style.transform]="tideTransform()">
    <div #waveTrack class="swell-track">
      <svg viewBox="0 0 2400 100" preserveAspectRatio="none">
        <path
          [attr.d]="waves()[2].body"
          [style.d]="cssPath(waves()[2].body)"
          [attr.fill]="ids.shallowUrl"
        />
        <path
          class="foam"
          [attr.d]="waves()[2].crest"
          [style.d]="cssPath(waves()[2].crest)"
          [style.opacity]="s.sea.foam"
        />
      </svg>
    </div>
  </div>
</div>

<!-- Same box and units as the land, drawn over the sea: y > 150 is on the water. -->
<svg class="land afloat" viewBox="0 0 1200 150" preserveAspectRatio="xMaxYMax slice">
  <!-- The land mirrored in the water, squashed and faint. -->
  <use class="reflection" [attr.href]="'#' + ids.land" transform="matrix(1 0 0 -0.42 0 213)" />
  <!-- Surf where the land meets the sea. -->
  <path
    class="surf"
    [attr.d]="horizon().nearRelief.surf + art.relief.surf"
    [style.opacity]="s.sea.foam"
  />
  @if (art.breakwater) {
    <path [attr.d]="art.breakwater" [style.fill]="s.land.near" />
  }
  @for (item of afloat(); track $index) {
    @let shape = shapes[item.kind];
    <g [attr.transform]="'translate(' + item.x + ' ' + item.y + ') scale(' + item.scale + ')'">
      <g
        class="bob"
        [class.is-sail]="item.kind === 'sail'"
        [class.is-breaker]="item.kind === 'breaker'"
        [style.--i]="$index"
      >
        @if (item.kind === 'breaker') {
          <path [attr.d]="shape.hull" [style.fill]="s.sea.swellMid" />
          <path [attr.d]="shape.top" [style.fill]="s.built.wall" />
        } @else if (item.kind === 'sail') {
          <path [attr.d]="shape.hull" [style.fill]="s.built.wall" />
          <path [attr.d]="shape.top" [style.fill]="s.built.sails[item.tone]" />
        } @else {
          <path [attr.d]="shape.hull" [style.fill]="s.built.wall" />
          <path [attr.d]="shape.top" [style.fill]="s.built.wall" />
          <path [attr.d]="shape.stripe" [style.fill]="s.built.trim" />
        }
      </g>
    </g>
  }
</svg>

<div class="rain" [class.is-on]="s.rain">
  @for (drop of rainDrops(); track $index) {
    <span class="drop" [style]="drop.style"></span>
  }
</div>
