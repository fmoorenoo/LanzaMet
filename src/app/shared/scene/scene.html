@let s = state();
@let art = scenery();

<div
  class="sky"
  [style.--sky-top]="s.sky.top"
  [style.--sky-mid]="s.sky.mid"
  [style.--sky-low]="s.sky.low"
></div>

<svg class="stars" viewBox="0 0 100 100" preserveAspectRatio="none" [style.opacity]="s.stars">
  @for (star of stars; track $index) {
    <circle [attr.cx]="star[0]" [attr.cy]="star[1]" [attr.r]="star[2]" />
  }
</svg>

<div class="track sun-track" [style.transform]="sunTransform()" [style.opacity]="s.sun.visible">
  <div class="sun" [style.color]="s.sun.color" [class.is-low]="s.sun.lowSun"></div>
</div>

<div class="track moon-track" [style.transform]="moonTransform()" [style.opacity]="s.moon.visible">
  <div class="moon"></div>
</div>

<div class="clouds" [style.color]="s.cloud">
  @for (cloud of clouds; track $index) {
    <div
      #cloudTrack
      class="cloud-track"
      [style.top.%]="cloud.top"
      [style.transform]="'translate3d(' + cloud.rest + '%, 0, 0)'"
      [style.opacity]="cloudOpacity($index, cloud.layer)"
    >
      <svg class="cloud" viewBox="0 0 200 80" [style.width.%]="cloud.width">
        <path [attr.d]="cloudPath" />
      </svg>
    </div>
  }
</div>

<svg class="land" viewBox="0 0 1200 150" preserveAspectRatio="xMaxYMax slice">
  <path class="land-far" [attr.d]="horizon().far" [style.fill]="s.land.far" />
  <path class="land-near" [attr.d]="horizon().near" [style.fill]="s.land.near" />
  <g class="scenery">
    @if (art.terrain) {
      <path [attr.d]="art.terrain" [style.fill]="s.land.near" />
    }
    @for (band of art.strata; track $index) {
      <path [attr.d]="band" [style.fill]="s.built.rock[$index % 3]" />
    }
    @if (art.lagoon) {
      <path [attr.d]="art.lagoon" [style.fill]="s.built.lagoon" />
    }
    @if (art.walls) {
      <!-- Glass first: a tower's floor lines and edges are walls drawn over it. -->
      <path [attr.d]="art.glass" [style.fill]="s.built.glass" />
      <path [attr.d]="art.walls" [style.fill]="s.built.wall" />
      <path [attr.d]="art.shade" [style.fill]="s.built.shade" />
      <path [attr.d]="art.windows" [style.fill]="s.built.window" />
    }
    @if (art.trunks) {
      <path class="trunks" [attr.d]="art.trunks" [style.stroke]="s.built.palm" />
      <path class="fronds" [attr.d]="art.fronds" [style.stroke]="s.built.palm" />
    }
    @for (lamp of art.lamps; track $index) {
      <circle
        class="lamp-halo"
        [attr.cx]="lamp.x"
        [attr.cy]="lamp.y"
        r="7"
        [style.fill]="s.built.lamp"
        [style.opacity]="s.built.lights * 0.3"
      />
      <circle
        [attr.cx]="lamp.x"
        [attr.cy]="lamp.y"
        r="1.7"
        [style.fill]="s.built.lamp"
        [style.opacity]="s.built.lights"
      />
    }
  </g>
</svg>

<div class="haze" [style.opacity]="s.haze"></div>

<div class="sea" [style.--sea-far]="s.sea.far" [style.--sea-near]="s.sea.near">
  <div
    class="track glint-track"
    [style.transform]="glint().transform"
    [style.opacity]="glint().opacity"
  >
    <div class="glint" [style.color]="glint().color"></div>
  </div>

  <div class="swell swell--far">
    <div #waveTrack class="swell-track">
      <svg viewBox="0 0 2400 100" preserveAspectRatio="none">
        <path
          [attr.d]="waves()[0].body"
          [style.d]="cssPath(waves()[0].body)"
          [style.fill]="s.sea.swellFar"
        />
      </svg>
    </div>
  </div>

  <div class="swell swell--mid">
    <div #waveTrack class="swell-track">
      <svg viewBox="0 0 2400 100" preserveAspectRatio="none">
        <path
          [attr.d]="waves()[1].body"
          [style.d]="cssPath(waves()[1].body)"
          [style.fill]="s.sea.swellMid"
        />
      </svg>
    </div>
  </div>

  <svg class="shore" viewBox="0 0 100 100" preserveAspectRatio="none">
    <path [attr.d]="shore()" [style.fill]="s.shore" />
  </svg>

  <div class="swell swell--front" [style.transform]="tideTransform()">
    <div #waveTrack class="swell-track">
      <svg viewBox="0 0 2400 100" preserveAspectRatio="none">
        <path
          [attr.d]="waves()[2].body"
          [style.d]="cssPath(waves()[2].body)"
          [style.fill]="s.sea.shallow"
        />
        <path
          class="foam"
          [attr.d]="waves()[2].crest"
          [style.d]="cssPath(waves()[2].crest)"
          [style.opacity]="s.sea.foam"
        />
      </svg>
    </div>
  </div>
</div>

<!-- Same box and units as the land, drawn over the sea: y > 150 is on the water. -->
@if (art.breakwater || afloat().length > 0) {
  <svg class="land afloat" viewBox="0 0 1200 150" preserveAspectRatio="xMaxYMax slice">
    @if (art.breakwater) {
      <path [attr.d]="art.breakwater" [style.fill]="s.land.near" />
    }
    @for (item of afloat(); track $index) {
      @let shape = shapes[item.kind];
      <g [attr.transform]="'translate(' + item.x + ' ' + item.y + ') scale(' + item.scale + ')'">
        <g class="bob" [class.is-sail]="item.kind === 'sail'" [style.--i]="$index">
          <path [attr.d]="shape.hull" [style.fill]="s.built.wall" />
          @if (item.kind === 'sail') {
            <path [attr.d]="shape.top" [style.fill]="s.built.sails[item.tone]" />
          } @else {
            <path [attr.d]="shape.top" [style.fill]="s.built.wall" />
            <path [attr.d]="shape.stripe" [style.fill]="s.built.trim" />
          }
        </g>
      </g>
    }
  </svg>
}

<div class="rain" [class.is-on]="s.rain">
  @for (drop of rainDrops(); track $index) {
    <span class="drop" [style]="drop.style"></span>
  }
</div>
