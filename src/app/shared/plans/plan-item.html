<button type="button" class="plan plan-card-button" (click)="open()">
  @if (scene(); as scene) {
    <span class="art">
      <lm-scene [state]="scene" variant="mini" />
    </span>
  }
  <span class="mark" aria-hidden="true">
    <lm-icon [name]="kind().icon" />
  </span>
  <span class="copy plan-copy">
    <span class="title plan-title">{{ plan().title | t }}</span>
    <span class="reason plan-reason">{{ plan().reason | t }}</span>
    <span class="when plan-window t-num">{{ when() | t }}</span>
  </span>
</button>
