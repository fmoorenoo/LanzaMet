<button type="button" class="plan" (click)="open()">
  @if (scene(); as scene) {
    <span class="art">
      <qth-scene [state]="scene" variant="mini" />
    </span>
  }
  <span class="mark" aria-hidden="true">
    <qth-icon [name]="kind().icon" />
  </span>
  <span class="copy">
    <span class="title">{{ plan().title }}</span>
    <span class="reason">{{ plan().reason }}</span>
    <span class="when t-num">{{ when() }}</span>
  </span>
</button>
