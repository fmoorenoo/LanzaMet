<lm-sheet
  [heading]="(isDemo ? 'settings.titleDemo' : 'settings.title') | t"
  [(open)]="ui.settingsOpen"
>
  <lm-language-selector id="language-selector" />

  @if (demoControls) {
    <ng-container *ngComponentOutlet="demoControls" />
  }

  <fieldset id="theme-selector" class="group theme-selector">
    <legend class="legend">{{ 'settings.appearance' | t }}</legend>
    @for (option of themeOptions; track option.value) {
      <label class="choice theme-option" [attr.data-theme-option]="option.value">
        <input
          type="radio"
          name="theme"
          [value]="option.value"
          [checked]="theme.preference() === option.value"
          (change)="setTheme(option.value)"
        />
        <span class="choice-text">
          <span class="choice-label">{{ option.label | t }}</span>
          @if (option.hint) {
            <span class="choice-hint">{{ option.hint | t }}</span>
          }
        </span>
      </label>
    }
  </fieldset>

  <!-- Already running as the app: nothing to install. -->
  @if (install.route() !== 'standalone') {
    <lm-install-option />
  }

  <!-- Sources, privacy and terms live on their own page; the sheet closes on the way there. -->
  <a id="legal-link" class="legal-link" routerLink="/legal" (click)="ui.settingsOpen.set(false)">
    <lm-icon name="privacy" />
    <span class="choice-text">
      <span class="choice-label">{{ 'route.legal' | t }}</span>
      <span class="choice-hint">{{ 'settings.legal.hint' | t }}</span>
    </span>
    <lm-icon class="chevron" name="chevron-right" />
  </a>
</lm-sheet>
