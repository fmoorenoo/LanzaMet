<nav id="main-navigation" class="bar main-navigation" aria-label="Principal">
  <a id="brand-link" class="brand brand-link" routerLink="/" aria-label="¿Qué tal hoy? — Inicio">
    <qth-brand-mark />
    <span class="brand-name">¿Qué tal hoy?</span>
  </a>

  <div class="tabs-wrap">
    <span
      id="nav-indicator"
      class="capsule nav-indicator"
      aria-hidden="true"
      [class.is-gliding]="canGlide()"
      [class.is-hidden]="capsuleIndex() < 0"
      [style.--i]="capsuleIndex()"
    ></span>
    <ul class="tabs nav-tabs">
      @for (item of items; track item.path) {
        <li>
          <a
            class="tab nav-tab"
            [attr.data-route]="item.id"
            [routerLink]="item.path"
            routerLinkActive="is-active"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          >
            <qth-icon class="tab-icon" [name]="item.icon" />
            <span class="tab-label">{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </div>

  <button
    id="nav-settings-button"
    type="button"
    class="settings settings-button"
    (click)="ui.openSettings()"
  >
    <qth-icon name="sliders" />
    <span>{{ isDemo ? 'Ajustes y demo' : 'Ajustes' }}</span>
  </button>
</nav>
