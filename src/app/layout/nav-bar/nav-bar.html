<nav id="main-navigation" class="bar main-navigation" [attr.aria-label]="'nav.label' | t">
  <a id="brand-link" class="brand brand-link" routerLink="/" [attr.aria-label]="'app.home' | t">
    <qth-brand-mark />
    <span class="brand-name">{{ 'app.brand' | t }}</span>
  </a>

  <div class="tabs-wrap" [style.--count]="items.length">
    <span
      id="nav-indicator"
      class="capsule nav-indicator"
      aria-hidden="true"
      [class.is-gliding]="canGlide()"
      [class.is-hidden]="capsuleIndex() < 0"
      [style.--i]="capsuleIndex()"
    ></span>
    <ul class="tabs nav-tabs">
      @for (item of items; track item.path) {
        <li>
          <a
            class="tab nav-tab"
            [attr.data-route]="item.id"
            [routerLink]="item.path"
            routerLinkActive="is-active"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          >
            <qth-icon class="tab-icon" [name]="item.icon" />
            <span class="tab-label">{{ item.label | t }}</span>
          </a>
        </li>
      }
    </ul>
  </div>

  <button
    id="nav-settings-button"
    type="button"
    class="settings settings-button"
    (click)="ui.openSettings()"
  >
    <qth-icon name="sliders" />
    <span>{{ (isDemo ? 'nav.settingsDemo' : 'nav.settings') | t }}</span>
  </button>
</nav>
